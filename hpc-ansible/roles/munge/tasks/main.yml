---

- name: Install Munge packages

  dnf:

    name:

      - munge

      - munge-libs

    state: present



- name: Create munge directory

  file:

    path: /etc/munge

    state: directory

    owner: munge

    group: munge

    mode: '0700'



- name: Deploy munge key

  copy:

    src: munge.key

    dest: "{{ munge_key_path }}"

    owner: munge

    group: munge

    mode: '0400'


- name: Enable munge

  service:

    name: munge

    enabled: true

    state: started
