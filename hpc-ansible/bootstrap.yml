---
- name: Bootstrap Rocky Linux nodes
  hosts: all
  become: true

  tasks:

    - name: Update packages
      dnf:
        name: "*"
        state: latest

    - name: Install Python libraries
      dnf:
        name:
          - python3
          - python3-libselinux
          - python3-firewall
          - git
          - vim
          - wget
          - curl
          - rsync
        state: present

    - name: Ensure chronyd starts
      service:
        name: chronyd
        enabled: yes
        state: started

